<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-labelledby="t d">
  <title id="t">How inline-next-steps works</title>
  <desc id="d">Four steps from left to right: the mod attaches an instruction to your prompt; Claude ends its answer with a next-steps block; the mod hides the block and shows checkboxes; ticked steps go into the prompt box, unsent.</desc>
  <style>
    .card { fill: #ffffff; stroke: #e4e2dc; }
    .num { fill: #c96442; }
    .numtxt { fill: #ffffff; }
    .head { fill: #1f1e1b; }
    .body { fill: #6b6860; }
    .arrow { stroke: #c9c5bc; fill: none; }
    .arrowhead { fill: #c9c5bc; }
    .note { fill: #8a877f; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1f1e1c; stroke: #3a3936; }
      .head { fill: #ece9e2; }
      .body { fill: #a8a49b; }
      .arrow { stroke: #55534e; }
      .arrowhead { fill: #55534e; }
      .note { fill: #8a877f; }
    }
  </style>

  <!-- 1 -->
  <rect class="card" x="10" y="20" width="180" height="160" rx="12"/>
  <circle class="num" cx="36" cy="46" r="13"/>
  <text class="numtxt" x="36" y="51" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text class="head" x="26" y="88" font-size="14.5" font-weight="600">Attach</text>
  <text class="body" x="26" y="112" font-size="12.5">Each prompt you send</text>
  <text class="body" x="26" y="130" font-size="12.5">carries a short hidden</text>
  <text class="body" x="26" y="148" font-size="12.5">instruction.</text>

  <!-- 2 -->
  <rect class="card" x="220" y="20" width="180" height="160" rx="12"/>
  <circle class="num" cx="246" cy="46" r="13"/>
  <text class="numtxt" x="246" y="51" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text class="head" x="236" y="88" font-size="14.5" font-weight="600">Answer</text>
  <text class="body" x="236" y="112" font-size="12.5">Claude ends its final</text>
  <text class="body" x="236" y="130" font-size="12.5">answer with a</text>
  <text class="body mono" x="236" y="148" font-size="11.5">&lt;next-steps&gt;</text>
  <text class="body" x="236" y="166" font-size="12.5">block.</text>

  <!-- 3 -->
  <rect class="card" x="430" y="20" width="180" height="160" rx="12"/>
  <circle class="num" cx="456" cy="46" r="13"/>
  <text class="numtxt" x="456" y="51" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text class="head" x="446" y="88" font-size="14.5" font-weight="600">Show</text>
  <text class="body" x="446" y="112" font-size="12.5">The block is hidden</text>
  <text class="body" x="446" y="130" font-size="12.5">and drawn as checkboxes</text>
  <text class="body" x="446" y="148" font-size="12.5">above the prompt.</text>

  <!-- 4 -->
  <rect class="card" x="640" y="20" width="170" height="160" rx="12"/>
  <circle class="num" cx="666" cy="46" r="13"/>
  <text class="numtxt" x="666" y="51" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text class="head" x="656" y="88" font-size="14.5" font-weight="600">Fill</text>
  <text class="body" x="656" y="112" font-size="12.5">Ticked steps go into</text>
  <text class="body" x="656" y="130" font-size="12.5">the prompt box. You</text>
  <text class="body" x="656" y="148" font-size="12.5">edit, then send.</text>

  <!-- arrows -->
  <path class="arrow" d="M193 100 h20" stroke-width="2"/><path class="arrowhead" d="M214 95 l7 5 l-7 5 z"/>
  <path class="arrow" d="M403 100 h20" stroke-width="2"/><path class="arrowhead" d="M424 95 l7 5 l-7 5 z"/>
  <path class="arrow" d="M613 100 h20" stroke-width="2"/><path class="arrowhead" d="M634 95 l7 5 l-7 5 z"/>

  <text class="note" x="410" y="214" font-size="12.5" text-anchor="middle">No second model call: the model that is already answering writes the suggestions, with the whole conversation in view.</text>
</svg>
